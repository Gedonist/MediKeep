[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medikeep-mcp"
version = "0.1.0"
description = "Read-only MCP server that gives AI agents a summary of MediKeep records"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
medikeep-mcp = "medikeep_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["medikeep_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
